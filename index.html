<script>(()=>{const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyhmG-S_JeNW0T7TbblTxe3bkxTRfUDm7rPP_usYrauLPH_5fHN84MtteFxEu_kFgPM-Q/exec';const questions=['Scham ist vor allem ein negatives Gefühl.',
    'Wenn Menschen keine Scham erleben würden, wären sie gesünder und glücklicher.',
    'Scham ist ein ausschließlich individuelles Gefühl.',
    'Frauen empfinden mehr Scham als Männer.',
    'Scham ist in allen Kulturen im Wesentlichen dasselbe.',
    'Eine Gesellschaft ohne Scham und Beschämung wäre eine bessere Gesellschaft.',
    'Öffentliche Beschämung kann ein legitimes Mittel sein, um gesellschaftliche Normen durchzusetzen.'];const $=id=>document.getElementById(id);const ids=['voteView','doneView','resultsView','count','num','question','range','back','next','status','showResults','sessions','results','refresh','backToVote','resultStatus'];const e=Object.fromEntries(ids.map(id=>[id,$(id)]));let session='s_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10),idx=0,answers=Array(7).fill(50),timer=null;
function render(){e.count.textContent=`${idx+1} / 7`;e.num.textContent=`AUSSAGE ${String(idx+1).padStart(2,'0')}`;e.question.textContent=questions[idx];e.range.value=answers[idx];e.back.disabled=idx===0;e.next.textContent=idx===6?'Abstimmung abschließen':'Stimme speichern';e.status.textContent=''}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>{clean();reject(new Error('Zeitüberschreitung beim Serverkontakt.'))},12000);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('Server nicht erreichbar.'))};s.src=SCRIPT_URL+'?'+new URLSearchParams({...params,callback:cb});document.body.appendChild(s)})}
async function save(){e.next.disabled=true;e.status.textContent='wird gespeichert …';try{let d=await jsonp({action:'vote',session:session,qid:String(idx+1),question:questions[idx],value:String(answers[idx])});if(!d.ok)throw new Error(d.error||'Speichern fehlgeschlagen.');if(idx===6){e.voteView.hidden=true;e.doneView.hidden=false;e.count.textContent='7 / 7'}else{idx++;render()}}catch(err){e.status.textContent=err.message}finally{e.next.disabled=false}}
function showResults(){e.voteView.hidden=true;e.doneView.hidden=true;e.resultsView.hidden=false;e.count.textContent='LIVE';loadResults();if(!timer)timer=setInterval(loadResults,5000)}
async function loadResults(){try{let d=await jsonp({action:'results'});if(!d.ok)throw new Error(d.error||'Auswertung fehlgeschlagen.');let total=d.totalSessions||0;e.sessions.textContent=`${total} ${total===1?'Teilnehmende:r':'Teilnehmende'}`;e.results.innerHTML=questions.map((q,i)=>{let r=(d.results||[]).find(x=>Number(x.qid)===i+1)||{values:[],n:0,mean:null};let dots=(r.values||[]).map(v=>`<span class="dot" style="left:${Math.max(0,Math.min(100,Number(v)))}%"></span>`).join('');let mean=r.mean==null?'':`<span class="mean" style="left:${r.mean}%" title="Mittelwert ${r.mean}"></span>`;return `<article class="result"><div class="rtitle">${i+1}. ${q}</div><div class="meta">${r.n||0} Antworten${r.mean==null?'':` · Mittelwert ${r.mean}`}</div><div class="axis">${dots}${mean}</div><div class="axisLabels"><span>stimme gar nicht zu</span><span>stimme völlig zu</span></div></article>`}).join('');e.resultStatus.textContent='Live · Aktualisierung alle 5 Sekunden'}catch(err){e.resultStatus.textContent=err.message}}
e.range.addEventListener('input',()=>answers[idx]=Number(e.range.value));e.next.addEventListener('click',save);e.back.addEventListener('click',()=>{if(idx>0){idx--;render()}});e.showResults.addEventListener('click',showResults);e.refresh.addEventListener('click',loadResults);e.backToVote.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null}e.resultsView.hidden=true;e.voteView.hidden=false;e.count.textContent=`${idx+1} / 7`});if(new URLSearchParams(location.search).get('results')==='1'||new URLSearchParams(location.search).get('admin')==='1')showResults();else render();})();</script></body></html>
